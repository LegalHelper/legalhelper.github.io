name: probe
on:
  workflow_dispatch:
    inputs:
      docs:
        default: "5142 305 37800 10699 39331"
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/probe.py ${{ github.event.inputs.docs }} > probe.txt 2>&1 || true
      - run: |
          git config user.name "LegalHelper"; git config user.email "axis.juris@bk.ru"
          git checkout -b probe-out; git add -f probe.txt; git commit -m probe; git push -f origin probe-out
