name: Ключевая ставка ЦБ
on:
  schedule:
    - cron: "17 4,10,16 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/update_rates.py
      - run: |
          git config user.name "LegalHelper"
          git config user.email "axis.juris@bk.ru"
          git add key_rates.json
          git diff --cached --quiet || (git commit -m "Ключевая ставка ЦБ: обновление" && git push)
